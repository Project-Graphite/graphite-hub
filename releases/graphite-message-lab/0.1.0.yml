project: graphite-message-lab
version: 0.1.0
tag: v0.1.0
previous: null
date: 2026-09-16
title: First message feed
summary: >
  The first version of the lab: visitors post a short message, Django stores it in PostgreSQL, and a
  Celery worker processes it in the background while the page polls for the result. It ships with a
  local Docker Compose setup and container images published to GitHub Container Registry.
changes:
  - type: added
    text: Visitors can post a message with their name from the browser and watch it appear on a feed that refreshes from the JSON API at /api/messages/
    commit: 2c96953
    author: AmrMsCLL
  - type: added
    text: A Celery worker picks up each new message through Redis, counts its words and marks it processed
    commit: 2c96953
    author: AmrMsCLL
  - type: added
    text: Health endpoints at /up/ and /up/databases report whether the app, PostgreSQL and Redis are reachable
    commit: 2c96953
    author: AmrMsCLL
  - type: added
    text: Docker Compose setup for local development, with CI that publishes immutable web and worker images to GitHub Container Registry on every push to main
    commit: 2c96953
    author: AmrMsCLL
  - type: added
    text: Production resources are generated for Kubernetes from the platform registry entry, with Docker Compose kept for local development only
    commit: "2973625"
    author: AmrMsCLL
