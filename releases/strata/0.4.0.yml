title: Notes, real-time editing and simple databases
summary: >
  Spaces gain notes that people write together in real time, with offline drafts, version history,
  mentions, templates and simple databases. Home gains weather, news, quick note and habit widgets
  and can pick a dashboard by time and device. Recurring totals everything in one currency, reads
  bank statements and splits shared costs.
