title: Spaces, tasks, subscriptions, the dashboard, the agenda and Tidy
summary: >
  Strata grows from an account into a workspace: shared spaces with invitations, files, search,
  tasks, recurring subscriptions, a customisable Home dashboard, an agenda with events and RSVPs,
  and Tidy for clearing out clutter. It can also be installed as an app.
