services:
  app:
    build: { context: ., target: deps }
    command: [npm, run, dev]
    environment:
      APP_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: local-only-session-secret
      DEV_LOGIN: ${DEV_LOGIN:?set DEV_LOGIN to your GitHub login}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports: ['3000:3000', '24678:24678']
    volumes: [./app:/app/app, ./server:/app/server, data:/app/data]
    depends_on:
      redis: { condition: service_healthy }

  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 96mb, --maxmemory-policy, noeviction]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
    volumes: [redis:/data]

volumes:
  data: {}
  redis: {}
