name: Sync releases

on:
  workflow_dispatch:
  repository_dispatch:
    types: [record-releases]
  schedule:
    - cron: "47 5 * * *"

concurrency:
  group: sync-releases
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Versions
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.PLATFORM_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Tag new versions and draft their entries
        id: sync
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npm run sync:releases -- --cut

      - run: node scripts/compile.mjs

      - name: Open release update
        working-directory: .
        env:
          APP_AUTHOR: app/${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add releases
          if git diff --cached --quiet; then
            echo "Releases already current."
            exit 0
          fi

          branch=automation/record-releases
          git config user.name "graphite-registry"
          git config user.email "registry@project-graphite.com"
          gh auth setup-git
          git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git switch -C "$branch"
          git commit --message "chore: record releases"
          git push --force-with-lease origin "HEAD:${branch}"

          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: record releases" \
              --body "Tags a new version for each project with releases: auto that has user-facing commits since its last version, and drafts changelog entries for every version tag without one. Titles and summaries can be refined in a follow-up pull request."
            pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          fi

          author="$(gh pr view "$pr" --json author --jq '.author.login')"
          if [ "$author" != "$APP_AUTHOR" ]; then
            echo "::error::Release PR #${pr} belongs to ${author}, not ${APP_AUTHOR}."
            exit 1
          fi

          base="$(gh pr view "$pr" --json baseRefName --jq '.baseRefName')"
          head="$(gh pr view "$pr" --json headRefName --jq '.headRefName')"
          if [ "$base" != "main" ] || [ "$head" != "$branch" ]; then
            echo "::error::Release PR #${pr} does not use the expected main <- ${branch} branches."
            exit 1
          fi

          file_count="$(gh pr view "$pr" --json files --jq '.files | length')"
          invalid_paths="$(gh pr view "$pr" --json files --jq '[.files[].path | select(test("^releases/[^/]+/[^/]+\\.yml$") | not)] | join(", ")')"
          if [ "$file_count" -eq 0 ] || [ -n "$invalid_paths" ]; then
            echo "::error::Release PR #${pr} changes files outside releases/*/*.yml: ${invalid_paths}"
            exit 1
          fi

          head_sha="$(git rev-parse HEAD)"
          run_id=""
          for attempt in {1..20}; do
            run_id="$(GH_TOKEN="$WORKFLOW_TOKEN" gh run list \
              --workflow pr.yml \
              --branch "$branch" \
              --event pull_request \
              --json databaseId,headSha \
              --jq "map(select(.headSha == \"$head_sha\"))[0].databaseId // empty")"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 3
          done

          if [ -z "$run_id" ]; then
            echo "::error::No PR workflow was registered for release PR #${pr}."
            exit 1
          fi

          GH_TOKEN="$WORKFLOW_TOKEN" gh run watch "$run_id" --exit-status
          gh pr merge "$pr" --squash --delete-branch --match-head-commit "$head_sha"

      - name: Report unread repositories
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::The sync could not read every repository; see the Tag new versions and draft their entries step."
          exit 1
